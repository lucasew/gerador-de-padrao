name: CI/CD

on:
    push:
        branches: ['main', 'master']
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install mise
              run: |
                  curl https://mise.run | sh
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install
              run: mise run install

            - name: Codegen
              run: mise run codegen

            - name: Check for changes
              run: |
                  if [[ -n $(git status --porcelain) ]]; then
                    echo "Changes detected after codegen"
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git checkout -b codegen-update-${{ github.sha }}
                    git add .
                    git commit -m "chore: update generated code"
                    git push origin codegen-update-${{ github.sha }}
                    gh pr create --title "chore: update generated code" --body "This PR updates the generated code." --base ${{ github.ref_name }} --head codegen-update-${{ github.sha }}
                    exit 1
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: CI
              run: mise run ci

            - name: Release
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              run: |
                  gh release create ${{ github.ref_name }} --generate-notes || true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Artifacts
              if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: release-artifacts
                  path: index.html
